<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--paper)}*{box-sizing:border-box}.lab{font:500 12px/1.3 var(--font-mono);color:var(--graphite)}.nm{font:600 14px/1.2 var(--font-display);color:var(--ink);letter-spacing:-.01em}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px"><div style="background:var(--ink);padding:16px;height:150px;display:flex;flex-direction:column;justify-content:space-between"><div style="font:600 20px var(--font-display);color:var(--paper);letter-spacing:-.025em">Papel 100%</div><div style="font:400 14px var(--font-body);color:var(--paper-85)">--paper-85 · links nav</div><div style="border-top:1px solid var(--paper-15);padding-top:6px;font:12px var(--font-mono);color:var(--paper-70)">--paper-15 regla</div></div><div style="position:relative;height:150px;overflow:hidden;background:var(--graphite)"><img src="../assets/photos/star-cases.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.8"><div style="position:absolute;inset:0;background:var(--scrim-photo)"></div><div style="position:absolute;left:12px;bottom:10px;font:12px var(--font-mono);color:var(--paper)">--scrim-photo</div></div><div style="border:1px solid var(--rule);padding:16px;height:150px;display:flex;flex-direction:column;gap:10px;justify-content:center"><div style="background:var(--ink);color:var(--paper);padding:6px 10px;font:500 14px var(--font-body);align-self:flex-start">::selection</div><div style="outline:2px solid var(--ink);outline-offset:3px;padding:6px 10px;font:500 14px var(--font-body);align-self:flex-start">:focus-visible</div></div></div></body></html>
