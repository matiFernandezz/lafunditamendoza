<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--paper)}*{box-sizing:border-box}.lab{font:500 12px/1.3 var(--font-mono);color:var(--graphite)}.nm{font:600 14px/1.2 var(--font-display);color:var(--ink);letter-spacing:-.01em}</style></head><body><div style="display:grid;grid-template-columns:200px 150px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)"><div class="lab" style="color:var(--ink)">--page-pad</div><div style="font:500 14px var(--font-mono);color:var(--ink)">20 → 24 → 40 → 64</div><div style="font:14px var(--font-body);color:var(--graphite)">margen lateral</div></div><div style="display:grid;grid-template-columns:200px 150px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)"><div class="lab" style="color:var(--ink)">--section-gap</div><div style="font:500 14px var(--font-mono);color:var(--ink)">64 → 96</div><div style="font:14px var(--font-body);color:var(--graphite)">entre secciones de la home</div></div><div style="display:grid;grid-template-columns:200px 150px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)"><div class="lab" style="color:var(--ink)">--page-gap</div><div style="font:500 14px var(--font-mono);color:var(--ink)">40 → 56</div><div style="font:14px var(--font-body);color:var(--graphite)">bloques en categoría/modelo</div></div><div style="display:grid;grid-template-columns:200px 150px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)"><div class="lab" style="color:var(--ink)">--tile-gap</div><div style="font:500 14px var(--font-mono);color:var(--ink)">12 → 16</div><div style="font:14px var(--font-body);color:var(--graphite)">grillas de fotos</div></div><div style="display:grid;grid-template-columns:200px 150px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)"><div class="lab" style="color:var(--ink)">--main-top / --main-bottom</div><div style="font:500 14px var(--font-mono);color:var(--ink)">32 → 56 / 80</div><div style="font:14px var(--font-body);color:var(--graphite)">bajo el header / cierre</div></div><div style="display:grid;grid-template-columns:200px 150px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)"><div class="lab" style="color:var(--ink)">--header-h</div><div style="font:500 14px var(--font-mono);color:var(--ink)">80</div><div style="font:14px var(--font-body);color:var(--graphite)">header público (admin 64)</div></div></body></html>
