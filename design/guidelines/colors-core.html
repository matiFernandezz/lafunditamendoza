<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--paper)}*{box-sizing:border-box}.lab{font:500 12px/1.3 var(--font-mono);color:var(--graphite)}.nm{font:600 14px/1.2 var(--font-display);color:var(--ink);letter-spacing:-.01em}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;background:var(--paper);border:1px solid var(--rule)"></div><div class="nm">Papel</div><div class="lab">--paper<br>#FAFAF8</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;background:var(--ink);"></div><div class="nm">Tinta</div><div class="lab">--ink<br>#121212</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;background:var(--graphite);"></div><div class="nm">Grafito</div><div class="lab">--graphite<br>#6B6B68</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;background:var(--rule);"></div><div class="nm">Regla</div><div class="lab">--rule<br>#E5E3DD</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;background:var(--black);"></div><div class="nm">Negro header</div><div class="lab">--black<br>#000000</div></div></div></body></html>
