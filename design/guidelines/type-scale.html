<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--paper)}*{box-sizing:border-box}.lab{font:500 12px/1.3 var(--font-mono);color:var(--graphite)}.nm{font:600 14px/1.2 var(--font-display);color:var(--ink);letter-spacing:-.01em}</style></head><body><div style="display:grid;grid-template-columns:120px 1fr;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px solid var(--rule)"><div class="lab">--text-page</div><div style="font-family:var(--font-display);font-size:56px;font-weight:600;line-height:.98;letter-spacing:-.03em;color:var(--ink);white-space:nowrap;overflow:hidden">Fundas / De diseño</div></div><div style="display:grid;grid-template-columns:120px 1fr;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px solid var(--rule)"><div class="lab">--text-section</div><div style="font-family:var(--font-display);font-size:36px;font-weight:600;letter-spacing:-.025em;color:var(--ink);white-space:nowrap;overflow:hidden">Recién llegados.</div></div><div style="display:grid;grid-template-columns:120px 1fr;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px solid var(--rule)"><div class="lab">--text-headline</div><div style="font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:-.025em;color:var(--ink);white-space:nowrap;overflow:hidden">Elegí por categoría</div></div><div style="display:grid;grid-template-columns:120px 1fr;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px solid var(--rule)"><div class="lab">--text-title</div><div style="font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:-.025em;color:var(--ink);white-space:nowrap;overflow:hidden">No encontramos esa página</div></div><div style="display:grid;grid-template-columns:120px 1fr;align-items:baseline;gap:12px;padding:6px 0;border-bottom:1px solid var(--rule)"><div class="lab">--text-card</div><div style="font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:-.025em;color:var(--ink);white-space:nowrap;overflow:hidden">Cherry Case</div></div></body></html>
